version: "3"

services:
  
  api1:
    container_name: api1
    build: ./api

    environment:
      - MESSAGE=${NOMBRE}
    ports:
      - "3000:3000"

  api2:
    container_name: api2
    build: ./api

    environment:
      - MESSAGE=${NOMBRE_2}
    ports:
      - "3002:3000"

  api3:
    container_name: api3
    build: ./api

    environment:
      - MESSAGE=${NOMBRE_3}
    ports:
      - "3003:3000"


  db:
    image: postgres:13
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DBNAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "5432:5432"

  